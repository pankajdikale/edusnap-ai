name: EduSnap CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Get repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 - Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4 - Build Frontend image
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./edusnap-frontend
          load: true
          tags: edusnap-frontend:test

      # Step 5 - Scan Frontend image
      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: edusnap-frontend:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      # Step 6 - Build Backend image
      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: edusnap-backend:test

      # Step 7 - Scan Backend with Trivy
      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: edusnap-backend:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      # Step 8 - Push Frontend
      - name: Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./edusnap-frontend
          push: true
          tags: pankajdikale/edusnap-frontend:v1

      # Step 9 - Push Backend
      - name: Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: pankajdikale/edusnap-backend:v1
